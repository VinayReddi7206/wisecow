# ---------------------------------------------------------------------------
# Ingress that exposes Wisecow over secure TLS (HTTPS).
# - Host: wisecow.local  (add "127.0.0.1 wisecow.local" to your hosts file)
# - TLS cert is stored in the secret "wisecow-tls" (created from gen-certs.sh)
# Requires the NGINX Ingress Controller to be enabled:
#     minikube addons enable ingress
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wisecow.local
      secretName: wisecow-tls
  rules:
    - host: wisecow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisecow-service
                port:
                  number: 80
