# ---------------------------------------------------------------------------
# Deployment for the Wisecow application.
# Runs 2 replicas of the container image built by the CI/CD pipeline.
# NOTE: replace the image below with YOUR registry path if your GitHub
#       username is different. Default assumes ghcr.io/VinayReddi7206/wisecow.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels:
    app: wisecow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wisecow
  template:
    metadata:
      labels:
        app: wisecow
    spec:
      containers:
        - name: wisecow
          image: ghcr.io/vinayreddi7206/wisecow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4499
          # Health checks: the app is a raw TCP/HTTP listener on 4499,
          # so a TCP probe is the reliable way to know it is alive.
          livenessProbe:
            tcpSocket:
              port: 4499
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 4499
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
